<script>
// Phones: treatment groups start collapsed so the page stays short. Wider screens: always open.
(function () {
  var mq = window.matchMedia('(max-width:700px)');
  var els = document.querySelectorAll('details.pillar');
  function sync() { els.forEach(function (d) { d.open = !mq.matches; }); }
  els.forEach(function (d) {
    d.querySelector('summary').addEventListener('click', function (e) { if (!mq.matches) e.preventDefault(); });
  });
  sync();
  mq.addEventListener ? mq.addEventListener('change', sync) : mq.addListener(sync);
})();
</script>
